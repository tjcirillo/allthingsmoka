<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moka — A Stovetop Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --espresso:#2B1B12;
    --steel:#7C8791;
    --copper:#B8632F;
    --cream:#F4EEE3;
    --card:#FFFFFF;
    --ink:#231810;
    --line:#E3DACB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  header{
    padding:56px 24px 32px;
    max-width:1200px;
    margin:0 auto;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--copper);
    font-weight:600;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(32px,5vw,56px);
    margin:8px 0 12px;
    letter-spacing:-0.01em;
  }
  h1 em{
    font-style:italic;
    font-weight:400;
    color:var(--copper);
  }
  .sub{
    color:var(--steel);
    font-size:16px;
    max-width:520px;
    line-height:1.5;
  }

  .toolbar{
    display:flex;
    gap:10px;
    margin-top:28px;
    flex-wrap:wrap;
  }
  .toolbar button{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
    transition:.15s ease;
  }
  .toolbar button:hover{ border-color:var(--copper); }
  .toolbar button.active{
    background:var(--espresso);
    color:var(--cream);
    border-color:var(--espresso);
  }

  .gallery{
    max-width:1200px;
    margin:0 auto;
    padding:0 24px 80px;
    column-count:4;
    column-gap:16px;
  }
  @media (max-width:1000px){ .gallery{column-count:3;} }
  @media (max-width:700px){ .gallery{column-count:2;} }
  @media (max-width:460px){ .gallery{column-count:1;} }

  figure{
    margin:0 0 16px;
    break-inside:avoid;
    border-radius:10px;
    overflow:hidden;
    background:var(--card);
    border:1px solid var(--line);
    cursor:zoom-in;
    position:relative;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  figure:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 24px -12px rgba(43,27,18,.35);
  }
  figure img{
    width:100%;
    display:block;
  }
  figcaption{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:10px 12px;
    font-size:12px;
    font-weight:500;
    color:#fff;
    background:linear-gradient(to top, rgba(20,12,6,.78), rgba(20,12,6,0));
    opacity:0;
    transition:opacity .2s ease;
  }
  figure:hover figcaption{ opacity:1; }

  /* Lightbox */
  .lightbox{
    position:fixed; inset:0;
    background:rgba(20,12,6,.92);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:40px 20px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width:min(900px, 90vw);
    max-height:80vh;
    border-radius:6px;
    box-shadow:0 30px 60px rgba(0,0,0,.5);
  }
  .lightbox .cap{
    position:absolute;
    bottom:36px;
    left:0; right:0;
    text-align:center;
    color:var(--cream);
    font-size:14px;
  }
  .lightbox .close{
    position:absolute;
    top:24px; right:28px;
    width:40px; height:40px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.3);
    background:transparent;
    color:#fff;
    font-size:18px;
    cursor:pointer;
  }
  .lightbox .close:hover{ background:rgba(255,255,255,.1); }
</style>
</head>

<header>
  <div class="eyebrow"><a href="index.html" style="color:inherit;text-decoration:none;">← All Things Moka</a> &nbsp;·&nbsp; Field notes &amp; still lifes</div>
  <h1>The <em>moka</em> archive</h1>
  <p class="sub">A running collection of stovetop espresso pots and moka-adjacent gear. Click any photo to view it full size.</p>

</header>

AAAAAAAAAAAAAAAAAAAaAAAAAAAAAAAH//Z",
      tag: "gear",
      caption: "MokaMinder™ — first flow alert gadget"
    },
  ];

  const gallery = document.getElementById('gallery');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxCap = document.getElementById('lightboxCap');

  function render(filter){
    gallery.innerHTML = '';
    photos
      .filter(p => filter === 'all' || p.tag === filter)
      .forEach(p => {
        const fig = document.createElement('figure');
        fig.innerHTML = `<img src="${p.src}" alt="${p.caption}" loading="lazy"><figcaption>${p.caption}</figcaption>`;
        fig.addEventListener('click', () => openLightbox(p));
        gallery.appendChild(fig);
      });
  }

  function openLightbox(p){
    lightboxImg.src = p.src;
    lightboxImg.alt = p.caption;
    lightboxCap.textContent = p.caption;
    lightbox.classList.add('open');
  }
  document.getElementById('closeBtn').addEventListener('click', () => lightbox.classList.remove('open'));
  lightbox.addEventListener('click', e => { if(e.target === lightbox) lightbox.classList.remove('open'); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') lightbox.classList.remove('open'); });

  document.querySelectorAll('.toolbar button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      render(btn.dataset.filter);
    });
  });

  render('all');
</script>
